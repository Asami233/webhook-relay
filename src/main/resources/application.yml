spring:
  application:
    name: webhook-relay
  # 本地开发：与 compose.yaml 共用 .env（KEY=VALUE），不存在则忽略
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${RELAY_DB_HOST:localhost}:${RELAY_DB_PORT:3307}/${RELAY_DB_NAME:relay}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${RELAY_DB_USER:relay}
    password: ${RELAY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      # 读已提交：抢任务的 SKIP LOCKED 查询不加间隙锁，幂等冲突后能读到对方已提交的行
      transaction-isolation: TRANSACTION_READ_COMMITTED
  mvc:
    problemdetails:
      enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

relay:
  admin-token: ${RELAY_ADMIN_TOKEN:}
  master-key: ${RELAY_MASTER_KEY:}
  max-payload-bytes: 65536

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
