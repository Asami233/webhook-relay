spring:
  application:
    name: webhook-relay
  # 本地开发：与 compose.yaml 共用 .env（KEY=VALUE），不存在则忽略
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${RELAY_DB_HOST:localhost}:${RELAY_DB_PORT:3307}/${RELAY_DB_NAME:relay}
    username: ${RELAY_DB_USER:relay}
    password: ${RELAY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      # 时区参数放这里而不是 URL：测试里 @ServiceConnection 会整体替换 URL，放 URL 里会被悄悄丢掉
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
      # 读已提交：抢任务的 SKIP LOCKED 查询不加间隙锁，幂等冲突后能读到对方已提交的行
      transaction-isolation: TRANSACTION_READ_COMMITTED
  data:
    redis:
      host: ${RELAY_REDIS_HOST:localhost}
      port: ${RELAY_REDIS_PORT:6379}
      # Redis 只做加速与限流，故障时要快速失败并放行（fail-open），不能拖住接收接口
      timeout: 500ms
      connect-timeout: 500ms
  mvc:
    problemdetails:
      enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

relay:
  admin-token: ${RELAY_ADMIN_TOKEN:}
  master-key: ${RELAY_MASTER_KEY:}
  max-payload-bytes: 65536
  ssrf:
    # 跳过 SSRF 检查的主机（按 URL 里的字面主机名精确匹配）。生产保持为空。
    allowed-hosts: []

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
