# 抓取本机运行的 Relay（./mvnw spring-boot:run，端口 8080）。Linux 上 host.docker.internal 由 compose 的 extra_hosts 提供。
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: webhook-relay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
